<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}
  </title>

  <style>
    body {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      font: 17px/1.7 -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
    }

    header a {
      color: inherit;
      text-decoration: none;
    }

    pre {
      padding: 16px;
      overflow-x: auto;
      background: #f6f8fa;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .site-header nav {
      display: flex;
      gap: 16px;
    }

    .site-header a {
      color: inherit;
      text-decoration: none;
    }

    .site-header nav a:hover {
      text-decoration: underline;
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin: 40px 0;
    }

    .pagination span {
      color: #777;
    }
    .comments-section {
      margin-top: 50px;
    }

    .comments-section h2 {
      margin-bottom: 20px;
    }
  </style>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [
          ['$', '$'],
          ['\\(', '\\)']
        ],
        displayMath: [
          ['$$', '$$'],
          ['\\[', '\\]']
        ],
        processEscapes: true
      }
    };
  </script>

  <script defer
    src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js">
  </script>
</head>

<body>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}">
      <strong>{{ site.title }}</strong>
    </a>

    <nav>
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
    </nav>
  </header>

  <hr>

  <main>
    {{ content }}

    {% if page.comments %}
      <section class="comments-section">
        <hr>
        <h2>评论</h2>
        {% include comments.html %}
      </section>
    {% endif %}
  </main>
</body>
</html>

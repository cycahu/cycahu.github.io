<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}
  </title>

  <style>
    body {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      font: 18px/1.7 -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
    }

    header a {
      color: inherit;
      text-decoration: none;
    }

    pre {
      padding: 16px;
      overflow-x: auto;
      background: #f6f8fa;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>

  <script defer
    src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js">
  </script>
</head>

<body>
  <header>
    <a href="{{ '/' | relative_url }}">
      <strong>{{ site.title }}</strong>
    </a>
  </header>

  <hr>

  <main>
    {{ content }}
  </main>
</body>
</html>

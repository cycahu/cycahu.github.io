title: cycahu 的博客
description: 我的个人博客
url: "https://cycahu.github.io"
baseurl: ""

markdown: kramdown

kramdown:
  input: GFM
  math_engine: mathjax

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-paginate

paginate: 10
paginate_path: "/page:num/"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      comments: true